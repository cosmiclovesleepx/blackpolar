name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/blackpolar
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm --filter @blackpolar/database db:generate
            pnpm --filter @blackpolar/api build
            pm2 reload blackpolar-api --update-env
            echo "✓ blackpolar-api deployed"
