# /etc/nginx/sites-available/blackpolar
#
# Vless/Xray ahora escucha en 7443 — el 443 queda libre para Nginx.
# Usamos un Origin Certificate de Cloudflare (gratis, 15 años, no expira
# como Let's Encrypt cada 90 días) ya que el DNS está proxyado (nube naranja).
#
# Generarlo en: Cloudflare Dashboard -> SSL/TLS -> Origin Server -> Create Certificate
# Guardar como /etc/nginx/ssl/cloudflare-origin.pem y /etc/nginx/ssl/cloudflare-origin.key
# Y en Cloudflare: SSL/TLS -> Overview -> modo "Full (strict)"

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── blackpolar.org — sitio público (Next.js, puerto 3000) ──────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blackpolar.org www.blackpolar.org;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── app.blackpolar.org — dashboard / panel admin (Next.js, puerto 3001) ─
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.blackpolar.org;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── api.blackpolar.org — Fastify (puerto 4000) ──────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.blackpolar.org;

    ssl_certificate     /etc/nginx/ssl/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/cloudflare-origin.key;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ── Redirección HTTP -> HTTPS para los tres hosts ───────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name blackpolar.org www.blackpolar.org app.blackpolar.org api.blackpolar.org;
    return 301 https://$host$request_uri;
}
